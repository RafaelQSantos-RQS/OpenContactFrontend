<form [formGroup]="form" (ngSubmit)="onConfirm()">
  <h2 mat-dialog-title>Excluir Contatos por Prefixo</h2>
  <mat-dialog-content>
    <p>Digite o prefixo dos nomes dos contatos que você deseja excluir. Esta ação é irreversível.</p>
    <mat-form-field>
      <mat-label>Prefixo do Nome</mat-label>
      <input matInput formControlName="prefix" cdkFocusInitial>
      @if (form.get('prefix')?.hasError('required')) {
        <mat-error>O prefixo é obrigatório.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="warn" type="submit" [disabled]="form.invalid">Excluir</button>
  </mat-dialog-actions>
</form>
